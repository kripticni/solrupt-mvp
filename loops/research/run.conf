# research engine loop config (run.conf — flags win over these, these win over defaults)
timeout_secs = 3600
# Delegation depth 3 pinned explicit (binary default is also 3; serve max_depth 3) — subagents to d2, never deeper without a stated reason.
depth = 3
# NO vsz cap — ulimit -v kills harness children (proven on fleet-ops 2026-09-10); envelope does not fit this workload
tee_transcript = false
wake_cap_secs = 21600
