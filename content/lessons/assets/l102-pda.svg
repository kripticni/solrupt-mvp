<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="PDA seeds and bump">
  <rect x="8" y="8" width="624" height="224" rx="10" fill="none" stroke="#8b949e" stroke-width="2"/>
  <text x="24" y="36" fill="#e6edf3" font-family="monospace" font-size="15">PDA: AN ADDRESS WITH NO PRIVATE KEY</text>
  <g font-family="monospace" font-size="13">
    <rect x="24" y="52" width="180" height="52" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="34" y="74" fill="#58a6ff">seeds</text>
    <text x="34" y="94" fill="#8b949e">[vault, authority]</text>
    <text x="214" y="84" fill="#e6edf3" font-size="18">+</text>
    <rect x="244" y="52" width="170" height="52" rx="6" fill="none" stroke="#d29922" stroke-width="2"/>
    <text x="254" y="74" fill="#d29922">bump (stored)</text>
    <text x="254" y="94" fill="#8b949e">canonical, on-chain</text>
    <text x="424" y="84" fill="#e6edf3" font-size="18">--&gt;</text>
    <rect x="454" y="52" width="162" height="52" rx="6" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <text x="464" y="74" fill="#3fb950">PDA address</text>
    <text x="464" y="94" fill="#8b949e">only program signs</text>
    <rect x="24" y="120" width="592" height="52" rx="6" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="34" y="142" fill="#f85149">caller-supplied bump --&gt; ground to a colliding address (bounces off)</text>
    <text x="34" y="162" fill="#8b949e">never accept bump as instruction input</text>
  </g>
  <text x="24" y="196" fill="#e6edf3" font-family="monospace" font-size="12">caption: the stored canonical bump is the only address the program can sign for.</text>
</svg>
