<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Overflow wrap number line">
  <rect x="8" y="8" width="624" height="234" rx="10" fill="none" stroke="#8b949e" stroke-width="2"/>
  <text x="24" y="36" fill="#e6edf3" font-family="monospace" font-size="15">THE NUMBER LINE THAT BITES ITS TAIL</text>
  <g font-family="monospace" font-size="13">
    <text x="34" y="66" fill="#8b949e">0 ───────────── 100 ──▶ u64::MAX (18.4 quintillion)</text>
    <rect x="24" y="80" width="280" height="56" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="34" y="102" fill="#58a6ff">debug: 100 - 101</text>
    <text x="34" y="122" fill="#58a6ff">PANIC (loud, safe)</text>
    <rect x="336" y="80" width="280" height="56" rx="6" fill="none" stroke="#f85149" stroke-width="2"/>
    <text x="346" y="102" fill="#f85149">release: 100 - 101</text>
    <text x="346" y="122" fill="#f85149">u64::MAX (silent!)</text>
    <rect x="24" y="150" width="592" height="46" rx="6" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <text x="34" y="172" fill="#3fb950">checked_sub: 100 - 101 --&gt; None --&gt; InsufficientFunds</text>
    <text x="34" y="190" fill="#8b949e">loud on every profile</text>
  </g>
  <text x="24" y="216" fill="#e6edf3" font-family="monospace" font-size="12">caption: on release the line is a circle. 100 minus 101 lands on quintillions.</text>
</svg>
